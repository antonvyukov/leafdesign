  <text x="50" y="161" fill="#454d3d" font-family="Georgia,serif" font-size="43" font-style="italic" font-weight="bold">Цветы — это</text><text x="50" y="208" fill="#454d3d" font-family="Georgia,serif" font-size="43" font-style="italic" font-weight="bold">язык, которому</text><text x="50" y="255" fill="#454d3d" font-family="Georgia,serif" font-size="43" font-style="italic" font-weight="bold">можно научиться.</text>
